<!doctype html>
<html lang="th">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Condo Care Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: header → [LINE phone + QR sticker | Admin web] → Social Engagement full width below.
   Single light theme matching the ZANROO QR demo palette (deep teal + slate). */
:root{
  color-scheme:light;
  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#F4F8F8; --surface-3:#F3F6F6; --ink:#1A2B33; --ink-2:#3C4A50; --muted:#6B7C85; --faint:#AEB9BD; --line:#D8E0E3;
  --strip:#1A2B33; --on-strip:#FFFFFF;
  --accent:#028090; --accent-dk:#016B78; --accent-br:#00A896; --accent-soft:#E8F3F4; --on-accent:#FFFFFF;
  --ok:#1B7A47; --ok-bg:#DCF2E4; --warn:#8A5300; --warn-bg:#FBEEDD; --bad:#B0281F; --bad-bg:#FADFDB; --info:#2A5AA4; --info-bg:#E3ECF8;
  --chat:#C9D6E3; --me-bg:#A9E5A0; --me-fg:#10200F; --line-green:#06C755; --qr-bg:#FFFFFF;
  --av1:#028090; --av2:#B06A00; --av3:#2A5AA4; --av4:#6B4FA0; --av5:#5B6B2E;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans Thai","Yu Gothic",Meiryo,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
html[lang="th"] body{line-height:1.62}
.wrap{max-width:1440px;margin:0 auto;overflow-wrap:break-word}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(20px,2.2vw,25px);font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;color:var(--ink-2)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent-dk);color:var(--on-accent);border-color:var(--accent-dk)}
.btn.pri:hover{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-3);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent} .chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent} .chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.dark{background:var(--strip);color:#fff;border-color:transparent}
.chip.line{background:var(--line-green);color:#fff;border-color:transparent}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.av.p1{background:var(--av1)}.av.p2{background:var(--av2)}.av.p3{background:var(--av3)}.av.p4{background:var(--av4)}.av.p5{background:var(--av5)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;padding-block:20px 14px;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.top .crumb{font-size:12px;font-weight:700;color:var(--accent)}
.top p{color:var(--muted);font-size:12.5px;margin-top:6px;max-width:110ch}
.lang{display:flex;border:1px solid var(--muted);overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 13px;font-weight:700;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.svc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.svc span{font-size:11.5px;font-weight:700;color:var(--accent-dk);background:var(--accent-soft);border-radius:6px;padding:3px 9px}
.ctrl{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap;padding-block:12px;margin-bottom:6px}
.ctrl .lbl{font-size:12px;color:var(--muted);font-weight:700}
.persona{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;position:relative}
.persona[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.persona small{display:block;font-size:10.5px;color:var(--muted);line-height:1.2;text-align:left}
.persona b{font-size:12.5px;display:block;text-align:left}
.persona .dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.ctrl{display:grid!important;gap:10px}
.crow{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.tryrow{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding-bottom:2px}
.tryrow .sc{flex:0 0 auto;padding:4px 9px;font-size:11.5px}
.sc:disabled{opacity:.4;cursor:not-allowed}
.pchip{display:inline-flex;align-items:center;gap:2px}
.pedit-btn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:24px;height:24px;font-size:12px;color:var(--muted);padding:0}
.pedit-btn:hover{color:var(--accent);border-color:var(--accent)}
.pedit{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:9px;max-width:760px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pgrid label{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--ink-2)}
@media (max-width:760px){.pgrid{grid-template-columns:1fr 1fr}}
.sc{border:1px solid var(--line);color:var(--accent);background:var(--surface);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:700}
.sc:hover{border-color:var(--accent);background:var(--accent-soft)}
.sc i{font-style:normal;color:var(--muted);margin-right:4px}
.grow{flex:1}

/* panes */
.stage{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.strip{background:var(--strip);color:var(--on-strip);padding:11px 16px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.strip small{font-weight:500;opacity:.7;font-size:11.5px}
.phone-pane{background:var(--surface-2)}
.phone-wrap{padding:16px 14px;display:grid;gap:14px;justify-items:center}
.admin{height:1000px}
.pane.se{margin-top:16px;height:600px}

/* phone */
.phone{width:min(330px,100%);height:700px;border-radius:34px;border:9px solid var(--strip);background:var(--chat);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ph-status{display:flex;justify-content:space-between;padding:7px 18px 3px;font-size:11.5px;font-weight:700;font-family:var(--f-mono);background:var(--surface)}
.ph-head{display:flex;align-items:center;gap:9px;padding:7px 12px 9px;background:var(--surface);border-bottom:1px solid var(--line)}
.ph-head b{font-size:13.5px;display:block;line-height:1.2}
.ph-head small{font-size:10.5px;color:var(--muted)}
.oa-badge{margin-left:auto;font-size:10px;font-weight:700;color:var(--line-green);border:1.5px solid var(--line-green);border-radius:4px;padding:0 4px}
.ph-chat{flex:1;overflow-y:auto;padding:10px 9px;display:flex;flex-direction:column;gap:9px}
.msg{display:flex;gap:6px;align-items:flex-end;max-width:90%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--surface);border-radius:15px;padding:7px 10px;font-size:12.5px;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.msg.me .bub{background:var(--me-bg);color:var(--me-fg)}
.bub .lnk{display:inline;border:0;background:none;padding:0;color:#1a5fd6;text-decoration:underline;font-size:12.5px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 8px;text-align:left;font-size:11.5px;font-weight:700;line-height:1.3}
.slots button small{display:block;font-weight:500;font-size:10px;color:var(--ok)}
.slots button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dk)}
.slots button:disabled{background:var(--surface-3);color:var(--faint);border-style:dashed;cursor:not-allowed}
.slots button:disabled small{color:var(--bad)}
.dates label.full{background:var(--surface-3);color:var(--faint);border-style:dashed}
.dates label.full small{color:var(--bad)}
.chatalert{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--info-bg);color:var(--info);padding:9px 14px;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--line)}
table.sched td{vertical-align:top;min-width:92px;font-size:11.5px}
table.sched th{font-size:10.5px}
.scell{display:flex;justify-content:space-between;align-items:center;gap:4px}
.scell .btn.icon{padding:2px 4px}.scell .ico{width:12px;height:12px}
.legend{display:inline-flex;gap:3px;margin-left:8px}.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.legend i.sc-free{background:var(--ok-bg)}.legend i.sc-part{background:var(--warn-bg)}.legend i.sc-full{background:var(--bad-bg)}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tip{display:inline-grid;place-items:center;color:var(--faint);cursor:help;margin-left:4px}
.tip:hover,.tip:focus{color:var(--accent)}
.tip .ico{width:14px;height:14px}
.tico{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-3);color:var(--muted)}
.tico .ico{width:13px;height:13px}
.tico.bad{background:var(--bad-bg);color:var(--bad)}.tico.warn{background:var(--warn-bg);color:var(--warn)}.tico.ok{background:var(--ok-bg);color:var(--ok)}
.tico.info{background:var(--info-bg);color:var(--info)}.tico.acc{background:var(--accent-soft);color:var(--accent)}
.tico.dark{background:var(--strip);color:#fff}.tico.line{background:var(--line-green);color:#fff}
.h4i{display:flex;align-items:center;gap:6px}
.h4i>.ico{color:var(--accent)}
.kv.icons{grid-template-columns:22px minmax(0,1fr);gap:7px 8px;align-items:start}
.kv.icons dt{color:var(--muted);display:flex;align-items:center;justify-content:center;padding-top:2px;position:relative}
.ibtn{display:inline-flex;align-items:center;gap:5px}
.btn.icon{padding:5px 7px;display:inline-grid;place-items:center}
.adm-top nav button .ico{width:15px;height:15px}
.meta-i{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.meta-i span{display:inline-flex;gap:4px;align-items:center}
.meta-i .ico{width:13px;height:13px}
.rmeta{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.rmeta .ico{width:12px;height:12px}
.asearch{display:flex;gap:6px;align-items:center}
.asearch input,.sesearch input{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;background:var(--surface);min-width:0}
.asearch input{width:260px}
.sesearch{display:flex;gap:5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.sesearch input{flex:1}
.ltabs{padding:8px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px;background:var(--surface)}
.ltabs .daytabs button{padding:3px 10px;font-size:11.5px}
.ltabs .cnt{margin-left:5px;opacity:.75;font-weight:600}
.ltabs select{font-size:12px;padding:4px 8px}
.qr-me{width:120px;height:120px}
.srchres{padding:7px 12px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface)}
.qrbar{padding:8px 12px 0;display:grid;gap:6px;border-top:1px solid var(--line)}
.qrtog{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted)}
.qrtog .chev{font-size:11px}
.qrbar .qchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.qredit{display:grid;gap:5px;max-height:150px;overflow-y:auto}
.qredit div{display:flex;gap:5px}
.qredit input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12.5px}
.callbtn{background:var(--line-green);border-color:var(--line-green);color:#fff;font-weight:700;padding:10px}
.callpop{position:absolute;inset:0;background:linear-gradient(180deg,var(--strip),#0d1518);color:#fff;display:grid;justify-items:center;align-content:center;gap:10px;text-align:center;z-index:5;padding:20px}
.callpop .cp-av{width:72px;height:72px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:28px;font-weight:700}
.callpop #call-t{font-size:13px;opacity:.85}
.callpop .cp-end{width:58px;height:58px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:24px;margin-top:18px;transform:rotate(135deg)}
.callpop small{font-size:11px;opacity:.75}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.fthumb img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.fchip{border:1px solid var(--line);background:var(--surface-3);border-radius:6px;padding:3px 8px;font-size:11px}
.irq{border-top:1px solid var(--line);padding-top:7px;display:grid;gap:6px;font-size:12.5px}
.irq:first-of-type{border-top:0;padding-top:0}
.irans{background:var(--ok-bg);border-radius:8px;padding:7px 9px}
.attc{border:1px dashed var(--line);border-radius:8px;padding:8px;display:grid;gap:6px}
.se-role{display:flex;gap:6px;align-items:center;font-size:11.5px}
.se-role select{border:0;border-radius:6px;padding:2px 6px;font-size:11.5px;background:var(--surface);color:var(--ink)}
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
.daytabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.daytabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
table.sched td.sc-full{background:var(--bad-bg)} table.sched td.sc-part{background:var(--warn-bg)} table.sched td.sc-free{background:var(--ok-bg)}
.se-th-head{flex-wrap:wrap}
.se-th-head select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:12px;background:var(--surface)}
.se-th-head label{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);font-weight:700}
.se-ci input,.se-ci textarea{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12.5px;width:100%;background:var(--surface)}
.se-ci .hist{display:grid;gap:5px}
.se-ci .hist div{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:11.5px;flex-wrap:wrap}
.se-ci2{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;font-size:12.5px;background:var(--surface)}
.ci-head{padding:12px 14px 8px;display:grid;gap:8px}
.ci-id{display:flex;gap:10px;align-items:center}
.ci-id .av{width:42px;height:42px;font-size:16px}
.ci-id b{font-size:14px;display:block}
.ci-id small{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:12px}
.lineic{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:var(--line-green);color:#fff;font-size:9px;font-weight:700}
.ci-acts{display:flex;gap:14px}
.ci-acts button{border:0;background:none;padding:0;color:var(--muted);font-size:12.5px}
.ci-acts button[aria-pressed="true"]{color:var(--warn)}
.ci-acts button:disabled{opacity:.55}
.ci-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.ci-tabs button{border:0;background:none;padding:8px 4px;font-size:12px;color:var(--ink-2)}
.ci-tabs button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);font-weight:700}
.ci-body{padding:10px;display:grid;gap:8px;align-content:start;overflow-y:auto;flex:1}
.fcard{background:var(--surface-2);border:0;border-radius:10px;padding:9px 12px;display:grid;gap:4px;text-align:left;width:100%;font-size:12.5px}
button.fcard:hover{background:var(--accent-soft)}
.fcard .lb{font-size:12px;color:var(--ink-2)}
.fcard .v{padding-left:14px;font-size:13px;overflow-wrap:anywhere}
.fcard .v.empty{color:var(--ink-2)}
.fcard input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface);width:100%}
.apchk{border-top:1px solid var(--line);padding-top:6px;display:grid;gap:4px;font-size:12px}
.apchk small{color:var(--muted);font-size:11px}
.ncform{display:grid;gap:9px}
.ncform label{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--ink-2)}
.msg time{font-size:9.5px;color:var(--ink-2);white-space:nowrap}
.oa-av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.card-msg{background:var(--surface);border-radius:13px;overflow:hidden;width:215px;font-size:12.5px}
.card-msg .cm-top{padding:9px 11px;border-bottom:1px solid var(--line)}
.card-msg .cm-top b{display:block;font-size:13px}
.card-msg .cm-top p{color:var(--muted);font-size:11.5px;margin-top:2px;overflow-wrap:anywhere}
.card-msg button{width:100%;border:0;background:var(--line-green);color:#fff;padding:8px;font-weight:700}
.ph-input{display:flex;gap:6px;padding:6px 8px;background:var(--surface);border-top:1px solid var(--line)}
.ph-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;background:var(--surface-2)}
.ph-input button{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:0 12px;font-size:12px;font-weight:700}
.rich{background:var(--surface);border-top:1px solid var(--line)}
.rich-toggle{width:100%;border:0;background:none;padding:4px;font-size:11.5px;color:var(--muted);font-weight:700}
.rich-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.rich.collapsed .rich-grid{display:none}
.rich-grid button{border:0;background:var(--accent-dk);color:#fff;padding:9px 4px;font-weight:700;font-size:11px;line-height:1.3;min-height:46px}
.rich-grid button:hover{background:var(--accent)}
.rich-grid button.hot{background:var(--strip)}

/* QR sticker demo prop */
.sticker{width:min(330px,100%);background:var(--surface);border:1px dashed var(--faint);border-radius:12px;padding:12px;display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center}
.sticker .qr-sm{background:var(--qr-bg);border:1px solid var(--line);border-radius:8px;padding:6px;width:112px;height:112px;display:grid;place-items:center}
.sticker .qr-sm img,.sticker .qr-sm canvas{width:98px!important;height:98px!important}
.sticker b{font-size:12.5px;display:block}
.sticker p{font-size:11.5px;color:var(--muted);margin:3px 0 8px}

  let st=msg.caseId?null:S.seTickets.find(x=>x.persona===pid&&seOpen(x)&&!x.caseId)||S.seTickets.find(x=>x.persona===pid&&seOpen(x));
  if(!st){st={no:'SE-'+(++S.seSeq),persona:pid,status:'open',agent:null,created:at,last:at,caseId:msg.caseId||null,seen:true};S.seTickets.push(st)}
  st.last=at;

}

const BOUND=['home','appliances','appForm','repair','tickets','ticket','info','insp','irForm'];
function openPage(page,arg){
  const pid=ph.persona;ph.err=null;
  if(page==='sso'){ph.liff=true;ph.page='sso';ph.sso=arg;return}
  if(page==='call'){ph.liff=true;ph.page='call';return}
  if(BOUND.includes(page)){
    const u=activeRoom(pid);
    if(!u){
      const rs=S.residents.filter(r=>r.persona===pid);
      const pend=rs.find(r=>r.status==='pending'),sso=rs.find(r=>r.status==='sso'),rm=rs.find(r=>r.status==='removed');
      ph.liff=true;
      if(sso){ph.page='sso';ph.sso=sso.id;ph.room=sso.room}
      else if(pend){ph.page='pending';ph.room=pend.room}
      else if(rm){ph.page='removed';ph.room=rm.room}
      else{ph.page='noaccess';ph.room=null}
      return;
    }
    ph.room=u;
  }
  ph.liff=true;ph.page=page;
  if(page==='ticket')ph.ticket=arg;
  if(page==='irForm'){ph.irArg=arg;ph.irFiles=[]}
  if(page==='appForm')ph.edit=arg||null;
  if(page==='repair'){ph.preAp=arg||null;if(arg)ph.rtype='app'}
}

  const pid=ph.persona;ph.liff=true;ph.room=room;ph.err=null;

  ph.page={active:'home',pending:'pending',sso:'sso',removed:'removed'}[r.status];

}

function preserve(el,html){
  const vals={};el.querySelectorAll('input[id],textarea[id]').forEach(i=>{if(i.type!=='file'&&i.type!=='checkbox')vals[i.id]=i.value});
  el.innerHTML=html;
  for(const id in vals){const i=el.querySelector('#'+CSS.escape(id));if(i&&!i.value&&vals[id])i.value=vals[id]}
}
function render(){renderCtrl();renderPhone();renderAdmin();renderSE()}

function approveToSSO(r){

  toLine(r.persona,{card:{title:K('card.sso.t'),sub:K('card.sso.s',{r:roomK(r.room)}),btn:'card.sso.b',page:'sso',arg:r.id}});
}
function removeResident(r){
  r.status='removed';r.until=now();
  S.requests.filter(q=>q.persona===r.persona&&q.room===r.room&&q.status==='pending').forEach(q=>{q.status='cancelled';q.reason=K('reason.removed')});
  toLine(r.persona,{text:K('m.removed',{r:roomK(r.room)})});
}
function newTicket(type,extra){
  const pre=PREFIX[type],key=pre.toLowerCase();
  const id=`${pre}-2611-${String(++S.seq[key]).padStart(3,'0')}`;const at=now();
  const r=resOf(ph.persona,ph.room);
  return Object.assign({id,type,ch:'line',lang:(r&&r.data.lang)||'en',room:ph.room,persona:ph.persona,status:'new',tech:0,created:at,last:at,unread:true,apUpd:null,log:[{k:'created',at}]},extra);
}
function submitTicket(x,note){
  S.tickets.push(x);
  /* the LIFF sends a plain-text summary into the chat as the resident → Social Engagement receives it like any chat */
  fromUser(ph.persona,{text:tmsgFor(x,note),caseId:x.id});
  toLine(ph.persona,{text:K('m.ack',{id:x.id})});
  ph.page='ticket';ph.ticket=x.id;adm.tab='req';adm.ticket=x.id;render();
}

    const st=S.seTickets[S.seTickets.length-1],at=S.clock;r.ans={text,files,at,se:st.no};
    x.last=at;x.unread=true;x.log.push({k:'irAns',x:text+(files.length?` (${t('files',{n:files.length})})`:''),at});
    if(x.status==='waiting'&&x.ir.every(q=>q.ans)){x.status='replied';x.log.push({k:'status',s:'replied',at,by:'res'})}
    toLine(ph.persona,{text:K('m.irThanks',{id:x.id})});
    ph.irFiles=[];ph.page='ticket';ph.ticket=x.id;adm.ticket=x.id;render();
  },
  attachChat(){
    const x=TK(adm.ticket),no=findNo(val('a-att'),S.seTickets.filter(s=>s.status!=='deleted').map(s=>s.no)),st=no&&seOf(no);
    if(!st){adm.attErr=x.id;return renderAdmin()}adm.attErr=null;
    x.att=x.att||[];if(!x.att.includes(no))x.att.push(no);x.log.push({k:'att',x:no,at:now()});x.last=S.clock;
    if(!st.caseId)st.caseId=x.id;st.seen=true;render();
  },
  chatAttach(d){
    const id=findNo(val('ac-att'),S.tickets.map(x=>x.id)),st=seOf(d.no),x=id&&TK(id);if(!st)return;
    if(!x){adm.attErr=d.no;return renderAdmin()}adm.attErr=null;
    x.att=x.att||[];if(!x.att.includes(st.no))x.att.push(st.no);x.log.push({k:'att',x:st.no,at:now()});x.last=S.clock;
    st.caseId=x.id;st.seen=true;if(st.status==='open')st.status='follow';render();
  },
  logCallback(){
    const x=TK(adm.ticket);const v=val('a-cb')||K('st.'+x.status);const at=now();x.last=at;x.cb='done';x.log.push({k:'callback',x:v,at});
    if(x.status==='new'){x.status='accepted';x.log.push({k:'status',s:'accepted',at})}
    renderAdmin();
  },
  ncOpen(){adm.nc={prop:'O',unit:null,caller:null,type:'water',ap:null};adm.err=null;renderAdmin()},
  ncCancel(){adm.nc=null;adm.err=null;renderAdmin()},
  ncSave(){
    const nc=adm.nc,title=val('n-title'),d=val('n-d');
    const isOther=nc.caller==='other';const cname=isOther?val('n-cname'):'',cphone=isOther?val('n-cphone'):'';
    if(!title||!d||(isOther&&!cname)){adm.err=K('nc.err');return renderAdmin()}
    const type=nc.type,pre=PREFIX[type],key=pre.toLowerCase(),id=`${pre}-2611-${String(++S.seq[key]).padStart(3,'0')}`,at=now();
    const x={id,type,ch:nc.se?'chat':'call',seNo:nc.se||null,room:nc.unit,persona:isOther?null:nc.caller,caller:isOther?{name:cname,phone:cphone}:null,title,d,status:'accepted',tech:0,created:at,last:at,unread:false,apUpd:null,cb:nc.se?null:'done',log:[{k:'created',at},{k:'status',s:'accepted',at}]};
    if(nc.se){const st=seOf(nc.se);if(st){st.caseId=id;st.seen=true;if(st.status==='open')st.status='follow'}}
    if(type==='app'){
      x.ap=val('n-ap')||null;
      if(x.ap==='other'){
        const o={type:val('n-otype'),brand:val('n-obrand'),model:val('n-omodel'),year:parseInt(val('n-oyear'),10)||CUR_YEAR,loc:'liv'};
        x.ap=null;x.apText=K('apx',{t:apTK(o),m:[o.brand,o.model].filter(Boolean).join(' ')});
        /* admin can add it to the registry straight away (no approval needed) */
        if(document.getElementById('n-oreg').checked&&o.brand&&o.model){const nid='ap'+(++S.seq.ap);S.appliances.push({id:nid,room:nc.unit,...o});x.ap=nid}
      }
    }
    const cc=val('n-cc');if(cc)x.log.splice(1,0,{k:'cc',x:cc,at});
    const g=grpOf(type,x.ap);
    if(g){x.slot=val('n-slot')||'asap';x.grp=g;if(isFull(g,x.slot)){adm.err=K('cap.full');return renderAdmin()}bookSlot(g,x.slot)}
    S.tickets.push(x);
    if(x.persona&&isActive(x.persona,x.room))toLine(x.persona,{text:K('m.ack',{id}),link:{page:'ticket',arg:id}});
    adm.nc=null;adm.ticket=id;adm.err=null;render();
  },
  approveReg(d){
    const r=S.residents.find(x=>x.id===d.id);
    if(occupants(r.room,r.persona).length){adm.conflict=r.id;adm.rejecting=null;return renderAdmin()}
    approveToSSO(r);render();
  },
  approveReplace(d){const r=S.residents.find(x=>x.id===d.id);occupants(r.room,r.persona).forEach(removeResident);adm.conflict=null;approveToSSO(r);render()},
  approveCo(d){const r=S.residents.find(x=>x.id===d.id);r.role='co';adm.conflict=null;approveToSSO(r);render()},
  conflictCancel(){adm.conflict=null;renderAdmin()},
  approveAp(d){
    const r=S.requests.find(x=>x.id===d.id);r.status='approved';now();
    if(r.kind==='add'){S.appliances.push({id:'ap'+(++S.seq.ap),room:r.room,...pick(r.data)});toLine(r.persona,{text:K('m.apOkAdd',{x:K('apx',{t:apTK(r.data),m:r.data.brand+' '+r.data.model})})})}
    else{const a=AP(r.target);if(a){Object.assign(a,pick(r.data));toLine(r.persona,{text:K('m.apOkEdit',{t:apTK(a),m:a.brand+' '+a.model,y:a.year})})}}
    render();
  },
  reject(d){adm.rejecting=d.id;adm.conflict=null;renderAdmin();const i=document.getElementById('rej-reason');if(i)i.focus()},
  rejCancel(){adm.rejecting=null;renderAdmin()},
  rejConfirm(d){
    const reason=val('rej-reason')||K('reason.default');adm.rejecting=null;now();
    const reg=S.residents.find(x=>x.id===d.id);
    if(reg){reg.status='rejected';toLine(reg.persona,{text:K('m.regRejected',{r:roomK(reg.room),x:reason})})}
    else{const r=S.requests.find(x=>x.id===d.id);r.status='rejected';r.reason=reason;toLine(r.persona,{text:K('m.apRej',{act:K('act.'+r.kind),t:apTK(r.data),x:reason})})}
    render();
  },
  selProp(d){adm.prop=d.p;adm.room=null;renderAdmin()},
  selRoom(d){adm.room=d.u;adm.err=null;renderAdmin()},
  propBack(){adm.prop=null;renderAdmin()},
  roomBack(){adm.room=null;adm.delAp=null;adm.rmRes=null;renderAdmin()},
  addApAdmin(){
    const data={type:val('n-type'),brand:val('n-brand'),model:val('n-model'),year:parseInt(val('n-year'),10),loc:val('n-loc')};
    if(data.type==='OT'){data.other=val('n-oth');if(!data.other){adm.err=K('e.other');return renderAdmin()}}
    if(!data.brand||!data.model||!data.year){adm.err=K('e.req');return renderAdmin()}
    if(data.year<1990||data.year>CUR_YEAR){adm.err=K('e.year',{y:CUR_YEAR});return renderAdmin()}
    S.appliances.push({id:'ap'+(++S.seq.ap),room:adm.room,...data});adm.err=null;
    ['n-brand','n-model','n-year','n-oth'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});render();
  },
  delAp(d){adm.delAp=d.id;renderAdmin()},
  delCancel(){adm.delAp=null;renderAdmin()},
  delConfirm(d){S.appliances=S.appliances.filter(a=>a.id!==d.id);S.requests.filter(r=>r.target===d.id&&r.status==='pending').forEach(r=>r.status='cancelled');adm.delAp=null;render()},
  rmRes(d){adm.rmRes=d.id;renderAdmin()},
  rmCancel(){adm.rmRes=null;renderAdmin()},
  rmConfirm(d){removeResident(S.residents.find(x=>x.id===d.id));adm.rmRes=null;render()},
  /* social engagement */
  selConv(d){se.conv=d.id;se.field=null;renderSE()},
  seSend(){const v=val('se-in');if(!v)return;const st=seLatest(se.conv),me=se.role==='adm'?(se.me||AGENTS[0]):AGENTS[0];if(st){if(!st.agent)st.agent=me;st.last=S.clock}
    S.chats[se.conv].push({from:'oa',by:'agent',agent:st?st.agent:me,text:v,at:now()});if(se.conv!==ph.persona&&S.lineUnread[se.conv]!=null)S.lineUnread[se.conv]++;document.getElementById('se-in').value='';render()},
  ciTab(d){se.tab=d.t;se.field=null;renderSE()},
  ciFieldEdit(d){se.field=d.k;renderSE();const i=document.getElementById('ci-f');if(i)i.focus()},
  ciFieldCancel(){se.field=null;renderSE()},
  ciFieldSave(d){const c=S.ci[se.conv];c[d.k]=val('ci-f');se.field=null;render()},
  ciFav(){const c=S.ci[se.conv];c.fav=!c.fav;renderSE()},
  ciFlag(){const c=S.ci[se.conv];c.flag=!c.flag;renderSE()},
  cmtAdd(){const v=val('ci-cmt');if(!v)return;S.ci[se.conv].comments.push({by:AGENTS[0],text:v,at:now()});document.getElementById('ci-cmt').value='';renderSE()},
  ciTake(){const st=seLatest(se.conv);if(st&&!st.agent)st.agent=ME;render()},
  /* chats in the admin web */
  chatView(d){adm.tab='chats';adm.chat=d.no;adm.nc=null;renderAdmin()},
  chatDismiss(d){const st=seOf(d.no);if(st)st.seen=true;renderAdmin()},
  selChat(d){adm.chat=d.no;renderAdmin()},
  chatTab(d){adm.chatTab=d.t;adm.chat=null;renderAdmin()},
  reqTab(d){adm.reqTab=d.t;adm.ticket=null;adm.nc=null;renderAdmin()},
  warWin(d){adm.warWin=+d.n;renderAdmin()},
  warNotify(d){warSend(AP(d.id));render()},
  warAll(){warRows(adm.warWin||180).filter(o=>!warN()[o.a.id]&&warRes(o.a).length).forEach(o=>warSend(o.a));render()},
  gotoCase(d){adm.tab='req';adm.ticket=d.id;adm.nc=null;renderAdmin()},
  createCase(d){
    const st=seOf(d.no),pid=st.persona,c=S.ci[pid]||{};
    const msgs=S.chats[pid].filter(m=>m.se===st.no&&m.from==='me').map(m=>L(m.text));
    const r=S.residents.find(x=>x.persona===pid&&x.status==='active');
    const unit=r?r.room:(c.unit&&R(c.unit)?c.unit:'O-1203');
    adm.nc={prop:R(unit).prop,unit,caller:r?pid:'other',type:'other',ap:null,se:st.no,title:(msgs[0]||'').split(/[.。!?]/)[0].slice(0,60),d:msgs.join('\n')};
    adm.tab='req';adm.err=null;renderAdmin();
  },
  schedBook(d){adm.nc={prop:'O',unit:null,caller:null,type:G2TYPE[d.g],ap:null,slot:d.s};adm.tab='req';adm.err=null;renderAdmin()},
  schedDay(d){adm.schedDay=+d.n;renderAdmin()},
  schedIns(d){adm.insDay=+d.n;renderAdmin()},
  /* case search (admin web) and ticket search (Social Engagement) */
  aSearch(){adm.q=val('a-q');adm.tab='req';adm.nc=null;adm.ticket=null;renderAdmin()},
  aSearchClear(){adm.q='';renderAdmin()},
  seSearch(){se.q=val('se-q');const q=se.q.trim().toLowerCase();
    if(q){const hit=S.seTickets.find(s=>s.no.toLowerCase()===q||(s.caseId||'').toLowerCase()===q);if(hit)se.conv=hit.persona}renderSE()},
  seSearchClear(){se.q='';renderSE()},
  /* editable quick replies */
  qrUse(d){const e=document.getElementById('se-in');e.value=L(S.qr[+d.n]);e.focus()},
  qrEdit(){se.qrEdit=!se.qrEdit;if(!se.qrEdit)saveQr();renderSE()},
  qrToggle(){if(se.qrEdit){saveQr();se.qrEdit=false}se.qrOpen=se.qrOpen===false;renderSE()},
  qrDel(d){saveQr();S.qr.splice(+d.n,1);renderSE()},
  qrAdd(){saveQr();S.qr.push('');renderSE();const ins=document.querySelectorAll('.qredit input');if(ins.length)ins[ins.length-1].focus()},
  /* call the 24h center (simulated) */
  callStart(){ph.call={at:Date.now()};renderPhone();clearInterval(ph.callT);ph.callT=setInterval(()=>{const el=document.getElementById('call-t');if(!el||!ph.call){clearInterval(ph.callT);return}const s=Math.floor((Date.now()-ph.call.at)/1000);el.textContent=s<3?t('call.ing'):`${t('call.conn')} · ${pad(Math.floor((s-3)/60))}:${pad((s-3)%60)}`},500)},
  callEnd(){ph.call=null;clearInterval(ph.callT);renderPhone()}
};
function saveQr(){const ins=[...document.querySelectorAll('.qredit input')];if(ins.length)S.qr=ins.map((i,n)=>i.value===L(S.qr[n])?S.qr[n]:i.value).filter(v=>L(v).trim())}
function pick(d){return {type:d.type,brand:d.brand,model:d.model,year:d.year,loc:d.loc}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const id=e.target.id;
  if(id==='ph-msg'){e.preventDefault();A.userChat()}else if(id==='se-in'){e.preventDefault();A.seSend()}
  else if(id==='a-q'){e.preventDefault();A.aSearch()}else if(id==='se-q'){e.preventDefault();A.seSearch()}});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='irf-f'){
    /* keep file names; read images so the admin web can show a thumbnail */
    [...e.target.files].forEach(f=>{
      const item={name:f.name,type:f.type,url:null};ph.irFiles.push(item);
      if(/^image\//.test(f.type)&&f.size<4e6){const rd=new FileReader();rd.onload=()=>{item.url=rd.result;const pv=document.getElementById('irf-prev');if(pv)pv.innerHTML=fileList(ph.irFiles)};rd.readAsDataURL(f)}
    });
    const pv=document.getElementById('irf-prev');if(pv)pv.innerHTML=fileList(ph.irFiles);e.target.value='';
  }
  else if(id==='se-role'){se.role=e.target.value;render()}
  else if(id==='a-role'){adm.role=e.target.value;if(adm.role==='tech'&&!adm.techId)adm.techId=6;adm.nc=null;renderAdmin()}
  else if(id==='a-techid'){adm.techId=+e.target.value;renderAdmin()}
  else if(id==='se-me'){se.me=e.target.value;render()}
  else if(id==='r-ap'){ph.preAp=e.target.value;document.getElementById('r-apbox').innerHTML=apBox(e.target.value);const sb=document.getElementById('r-slotbox');if(sb)sb.innerHTML=slotPick(grpOf('app',e.target.value))}
  else if(id==='se-status'||id==='ac-status'){const st=id==='se-status'?seLatest(se.conv):seOf(adm.chat);if(st){st.status=e.target.value;st.seen=true}render()}
  else if(id==='se-agent'){const st=seLatest(se.conv);if(st)st.agent=e.target.value||null;render()}
  else if(adm.nc&&['n-prop','n-unit','n-type','n-caller','n-ap'].includes(id)){adm.nc.title=val('n-title');adm.nc.d=val('n-d');adm.nc[id.slice(2)]=e.target.value;if(id==='n-prop')adm.nc.unit=null;if(id==='n-unit')adm.nc.caller=null;renderAdmin()}
  else if(id==='r-upd'){document.getElementById('r-updf').hidden=!e.target.checked}
  else if(id==='a-f'){adm.reqF=e.target.value;adm.ticket=null;renderAdmin()}
  else if(id==='ac-f'){adm.chatF=e.target.value;adm.chat=null;renderAdmin()}
  else if(id==='n-type'&&!adm.nc){adm.newType=e.target.value;renderAdmin()}
  else if(id==='a-tech'){const x=TK(adm.ticket);x.tech=+e.target.value;const at=now();x.last=at;x.log.push({k:'tech',x:x.tech,at});renderAdmin()}
});

resetAll();renderShell();render();
</script>

</html>
